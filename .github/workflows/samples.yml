name: Build Samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-samples:
    name: Build Samples
    runs-on: ubuntu-latest
    env:
      MVN: ./mvnw --show-version --batch-mode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - run: $MVN install
        working-directory: bom
      - run: $MVN install
      - run: $MVN -f samples/pom.xml -Denvironment.base=/elemento/samples/music -P prod install
      - name: Package and upload samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd samples/dist/target/samples
          zip -rq /tmp/samples.zip .
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          gh release upload "$LATEST_TAG" /tmp/samples.zip --clobber
