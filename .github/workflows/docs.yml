name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Build docs
        working-directory: docs
        run: pnpm docs:build
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern 'apidocs.zip' --dir /tmp/assets 2>/dev/null && \
            unzip -q /tmp/assets/apidocs.zip -d docs/.vitepress/dist/apidocs || \
            echo "No apidocs.zip found in latest release — skipping"
          gh release download --pattern 'samples.zip' --dir /tmp/assets 2>/dev/null && \
            unzip -q /tmp/assets/samples.zip -d docs/.vitepress/dist/samples || \
            echo "No samples.zip found in latest release — skipping"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
